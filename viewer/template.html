<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人知识库</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2f6fed;--chip:#eef2ff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
h1{margin:0 0 10px;font-size:19px;display:flex;gap:10px;align-items:baseline}
h1 small{font-size:12px;color:var(--muted);font-weight:400}
.bar{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{padding:3px 10px;border-radius:99px;background:var(--chip);color:#3949ab;font-size:12px;cursor:pointer;border:1px solid transparent}
.chip.on{background:var(--accent);color:#fff}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;height:calc(100vh - 118px)}
#list{overflow:auto;border-right:1px solid var(--line);padding:10px}
.item{padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:var(--card);border:1px solid var(--line)}
.item:hover{border-color:#c7d2fe}
.item.on{border-color:var(--accent);box-shadow:0 0 0 2px #dbe6ff}
.item .t{font-weight:600;font-size:14px;line-height:1.45}
.item .m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.tag{background:#f1f5f9;color:#475569;border-radius:6px;padding:0 6px;font-size:11px;margin-right:4px}
#view{overflow:auto;padding:26px 34px}
#view article{max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 32px}
#view h2{font-size:15px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line);color:#334155}
#view h3{font-size:14px}
#view img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:8px 0}
#view blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid #c7d2fe;background:#f8faff;color:#374151}
#view pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto;font-size:12.5px;line-height:1.55}
#view table{border-collapse:collapse;width:100%;font-size:13px}
#view th,#view td{border:1px solid var(--line);padding:6px 9px;text-align:left}
#view th{background:#f8fafc}
.meta{color:var(--muted);font-size:12.5px;margin:6px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.meta a{color:var(--accent);text-decoration:none}
.empty{color:var(--muted);padding:40px;text-align:center}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#list{max-height:40vh}#view{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>个人知识库 <small id="count"></small></h1>
  <div class="bar"><input id="q" placeholder="搜索标题、内容、标签…"></div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="list"></div>
  <div id="view"><div class="empty">← 点左边一条开始看</div></div>
</main>
<script>
const DATA = __DATA__;
const BUILT = "__BUILT__";
const listEl=document.getElementById('list'), viewEl=document.getElementById('view');
const qEl=document.getElementById('q'), chipsEl=document.getElementById('chips'), countEl=document.getElementById('count');
let activeTag=null, current=null;
const allTags=[...new Set(DATA.flatMap(e=>e.tags))];
chipsEl.innerHTML = allTags.map(t=>`<span class="chip" data-tag="${t}">${t}</span>`).join('');
chipsEl.onclick=e=>{const c=e.target.closest('.chip'); if(!c)return; const t=c.dataset.tag; activeTag=(activeTag===t?null:t); [...chipsEl.children].forEach(x=>x.classList.toggle('on',x.dataset.tag===activeTag)); render();};
qEl.oninput=()=>render();
function match(e,q){ if(!q) return true; return (e.title+' '+e.summary+' '+e.tags.join(' ')+' '+e.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q); }
function render(){
  const q=qEl.value.trim().toLowerCase();
  const rows=DATA.filter(e=>(!activeTag||e.tags.includes(activeTag))&&match(e,q));
  countEl.textContent=`共 ${DATA.length} 条 · 当前 ${rows.length} 条 · 更新于 ${BUILT}`;
  listEl.innerHTML=rows.map(e=>`<div class="item${current===e?' on':''}" data-i="${DATA.indexOf(e)}">
    <div class="t">${e.title}</div>
    <div class="m"><span>${e.date||''}</span><span>${e.type}</span>${e.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  </div>`).join('') || '<div class="empty">没有匹配的条目</div>';
}
listEl.onclick=e=>{const it=e.target.closest('.item'); if(!it)return; show(DATA[+it.dataset.i]);};
function show(e){
  current=e; render();
  viewEl.innerHTML=`<article>
    <h1 style="font-size:20px;margin:0 0 6px">${e.title}</h1>
    <div class="meta"><span>${e.type}</span><span>入库 ${e.date||''}</span>${e.author?`<span>${e.author}</span>`:''}${e.publish?`<span>发布 ${e.publish}</span>`:''}</div>
    <div class="meta">${e.tags.map(t=>`<span class="tag">${t}</span>`).join(' ')}${e.source?`<a href="${e.source}" target="_blank">打开原链接 ↗</a>`:''}</div>
    <div style="margin-top:18px">${e.html}</div>
  </article>`;
  viewEl.scrollTop=0;
}
render();
</script>
</body>
</html>
