<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的知识库</title>
<style>
:root{
  --bg:#ffffff; --bg-soft:#f7f8fa; --bg-hover:#f1f3f6;
  --ink:#1f2329; --ink-2:#4a5058; --muted:#8a9099;
  --line:#e6e8eb; --accent:#2f6fed; --accent-soft:#eef3fe;
  --radius:8px; --sidebar-w:264px; --list-w:320px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ============ 整体骨架 ============ */
.app{display:flex;height:100vh;overflow:hidden}

/* ============ 左侧栏 ============ */
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--bg-soft);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;font-weight:600;font-size:15px}
.brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#7c5cff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.searchbox{padding:0 12px 10px;position:relative}
.searchbox input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:13.5px;outline:none;color:var(--ink)}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .ico{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.nav{flex:1;overflow-y:auto;padding:4px 8px 12px}
.nav .group{margin:10px 0 2px;padding:0 8px;font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.nav button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;font-size:13.5px;color:var(--ink-2);cursor:pointer;text-align:left}
.nav button:hover{background:var(--bg-hover);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--muted)}
.nav .tagcloud{display:flex;flex-wrap:wrap;gap:5px;padding:4px 8px}
.nav .tagcloud span{padding:2px 8px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.nav .tagcloud span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.userbar{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.userbar .avatar{width:26px;height:26px;border-radius:99px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.userbar .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.userbar button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px}
.userbar button:hover{color:var(--accent)}

/* ============ 主区 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex:0 0 52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.hamburger{display:none;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink-2)}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}

.panes{flex:1;display:flex;min-height:0}
.listpane{width:var(--list-w);flex:0 0 var(--list-w);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.item{padding:10px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.item:hover{background:var(--bg-hover)}
.item.on{background:var(--accent-soft);border-color:#cddbfb}
.item .t{font-size:14px;font-weight:600;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11px;color:var(--ink-2)}
.pill.douyin{border-color:#ffd9e0;background:#fff5f7;color:#c2185b}
.pill.wechat{border-color:#d6ecd9;background:#f3fbf4;color:#2e7d32}
.pill.xhs{border-color:#ffdbe4;background:#fff5f8;color:#d81b60}
.readerpane{flex:1;overflow-y:auto;padding:26px 32px 60px}
.sheet{max-width:820px;margin:0 auto}
.sheet h1{font-size:26px;line-height:1.4;margin:0 0 10px;font-weight:700}
.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.divider{height:1px;background:var(--line);margin:16px 0 20px}
article h2{font-size:17px;margin:30px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
article h3{font-size:15.5px;margin:20px 0 8px}
article p{margin:10px 0}
article img{max-width:100%;border-radius:var(--radius);border:1px solid var(--line);display:block;margin:12px auto}
article blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--bg-soft);border-radius:0 6px 6px 0;color:var(--ink-2);font-size:14px}
article pre{background:#f6f8fa;border:1px solid var(--line);padding:14px;border-radius:var(--radius);overflow:auto;font-size:12.5px;line-height:1.6;font-family:ui-monospace,Consolas,monospace}
article code{font-family:ui-monospace,Consolas,monospace;background:#f6f8fa;padding:1px 4px;border-radius:4px}
article table{border-collapse:collapse;width:100%;font-size:13.5px;margin:12px 0}
article th,article td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
article th{background:var(--bg-soft);font-weight:600}
article ul,article ol{padding-left:22px}
.empty{color:var(--muted);text-align:center;padding:70px 20px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}
.backbtn{display:none;border:0;background:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 0 8px}

/* ============ 移动端 ============ */
.mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
@media (max-width:920px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .22s ease}
  .sidebar.open{transform:none}
  .mask.show{display:block}
  .hamburger{display:block}
  .listpane{width:100%;flex:1}
  .readerpane{display:none;padding:16px 14px 50px}
  .readerpane.show{display:block}
  .panes{position:relative}
  .listpane.hide{display:none}
  .backbtn{display:inline-block}
  .sheet h1{font-size:21px}
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15181d;--bg-soft:#1b1f26;--bg-hover:#222731;--ink:#e6e8eb;--ink-2:#b6bcc6;--muted:#8a9099;--line:#2a303a;--accent:#6d94ff;--accent-soft:#1e2a44}
  .searchbox input{background:#15181d;color:var(--ink)}
  .pill{background:#1b1f26}
  article pre{background:#11141a}
  article code{background:#1b1f26}
}
</style>
</head>
<body>
<div class="app">
  <div class="mask" id="mask"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="mark">知</span>我的知识库</div>
    <div class="searchbox"><span class="ico">🔍</span><input id="q" placeholder="搜索标题、正文、标签"></div>
    <nav class="nav" id="nav"></nav>
    <div class="userbar">
      <span class="avatar" id="avatar">·</span>
      <span class="name" id="uname">未登录</span>
      <button id="logout">退出</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="crumb">全部条目 <span>/</span> <b id="crumbTitle">—</b></div>
      <div class="spacer"></div>
      <div class="stat" id="stat"></div>
    </header>
    <div class="panes">
      <div class="listpane" id="listpane"><div id="list"></div></div>
      <div class="readerpane" id="readerpane">
        <button class="backbtn" id="backbtn">← 返回列表</button>
        <div id="reader"><div class="empty"><b>知识库已就绪</b>从左侧选择一条开始阅读</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const DATA = __DATA__;
const BUILT = "__BUILT__";
const $ = id => document.getElementById(id);
const state = { type: "all", tag: null, q: "", current: null };

const TYPE_LABEL = { "抖音视频": "抖音视频", "微信公众号": "微信公众号", "笔记": "笔记" };
const TYPE_CLASS = { "抖音视频": "douyin", "微信公众号": "wechat", "小红书": "xhs" };

function types() {
  const m = {};
  DATA.forEach(e => { m[e.src] = (m[e.src] || 0) + 1; });
  return m;
}
function allTags() {
  const m = {};
  DATA.forEach(e => e.tags.forEach(t => { m[t] = (m[t] || 0) + 1; }));
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 18);
}
function renderNav() {
  const t = types();
  let html = '<div class="group">全部</div>';
  html += '<button data-type="all" class="' + (state.type === "all" ? "on" : "") + '">📚 全部条目<span class="count">' + DATA.length + "</span></button>";
  html += '<div class="group">按来源</div>';
  Object.keys(t).forEach(k => {
    html += '<button data-type="' + k + '" class="' + (state.type === k ? "on" : "") + '">' +
      (k === "抖音视频" ? "🎬" : k === "微信公众号" ? "📰" : "📝") + " " + k +
      '<span class="count">' + t[k] + "</span></button>";
  });
  const tags = allTags();
  if (tags.length) {
    html += '<div class="group">标签</div><div class="tagcloud">' +
      tags.map(([t, n]) => '<span data-tag="' + t + '" class="' + (state.tag === t ? "on" : "") + '">' + t + " " + n + "</span>").join("") +
      "</div>";
  }
  $("nav").innerHTML = html;
}
$("nav").onclick = e => {
  const b = e.target.closest("button");
  if (b) { state.type = b.dataset.type; state.tag = null; renderNav(); renderList(); return; }
  const s = e.target.closest(".tagcloud span");
  if (s) { state.tag = (state.tag === s.dataset.tag ? null : s.dataset.tag); renderNav(); renderList(); }
};
$("q").oninput = () => { state.q = $("q").value.trim().toLowerCase(); renderList(); };

function filtered() {
  return DATA.filter(e =>
    (state.type === "all" || e.src === state.type) &&
    (!state.tag || e.tags.includes(state.tag)) &&
    (!state.q || (e.title + e.summary + e.tags.join(" ") + e.html.replace(/<[^>]+>/g, " ")).toLowerCase().includes(state.q)));
}
function renderList() {
  const rows = filtered();
  $("stat").textContent = rows.length + " / " + DATA.length + " 条 · 更新于 " + BUILT;
  $("list").innerHTML = rows.length ? rows.map(e =>
    '<div class="item' + (state.current === e ? " on" : "") + '" data-i="' + DATA.indexOf(e) + '">' +
    '<div class="t">' + e.raw_title + "</div>" +
    '<div class="m"><span class="pill ' + (TYPE_CLASS[e.src] || "") + '">' + e.src + "</span><span>" + (e.date || "") + "</span></div>" +
    '<div class="m" style="margin-top:2px">' + e.summary.slice(0, 60) + "</div></div>").join("")
    : '<div class="empty">没有匹配的条目</div>';
}
$("list").onclick = e => {
  const it = e.target.closest(".item");
  if (it) open(DATA[+it.dataset.i]);
};
function open(e) {
  state.current = e;
  renderList();
  $("crumbTitle").textContent = e.raw_title;
  $("reader").innerHTML = '<div class="sheet"><h1>' + e.raw_title + "</h1>" +
    '<div class="meta"><span class="pill ' + (TYPE_CLASS[e.src] || "") + '">' + e.src + "</span>" +
    "<span>入库 " + (e.date || "—") + "</span>" + (e.author ? "<span>" + e.author + "</span>" : "") +
    (e.publish ? "<span>发布 " + e.publish + "</span>" : "") +
    (e.source ? '<a href="' + e.source + '" target="_blank" rel="noopener">打开原链接 ↗</a>' : "") + "</div>" +
    '<div class="meta">' + e.tags.map(t => '<span class="pill">' + t + "</span>").join(" ") + "</div>" +
    '<div class="divider"></div><article>' + e.html + "</article></div>";
  if (window.innerWidth <= 920) {
    $("listpane").classList.add("hide");
    $("readerpane").classList.add("show");
  }
  $("readerpane").scrollTop = 0;
}
$("backbtn").onclick = () => {
  $("listpane").classList.remove("hide");
  $("readerpane").classList.remove("show");
};
$("hamburger").onclick = () => { $("sidebar").classList.add("open"); $("mask").classList.add("show"); };
$("mask").onclick = () => { $("sidebar").classList.remove("open"); $("mask").classList.remove("show"); };
$("logout").onclick = async () => {
  try { await fetch("/api/logout", { method: "POST" }); } catch (e) {}
  location.href = "/login";
};

(async () => {
  try {
    const r = await fetch("/api/me");
    if (r.status === 401) { location.href = "/login"; return; }
    const me = await r.json();
    $("uname").textContent = me.user || "已登录";
    $("avatar").textContent = (me.user || "?").slice(0, 1).toUpperCase();
  } catch (e) { /* 静态打开时忽略 */ }
})();

renderNav();
renderList();
if (window.innerWidth > 920 && DATA.length) open(DATA[0]);
</script>
</body>
</html>
